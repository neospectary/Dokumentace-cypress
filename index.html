  <!-- Theme toggle logic -->
  <script>
    (function() {
      const html = document.documentElement;
      const themeToggle = document.getElementById('theme-toggle-checkbox');

      // Načti uloženou preferenci z localStorage
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        html.setAttribute('data-theme', 'light');
        themeToggle.checked = true;
      }

      // Poslouchej změny toggle switche
      themeToggle.addEventListener('change', function() {
        if (this.checked) {
          html.setAttribute('data-theme', 'light');
          localStorage.setItem('theme', 'light');
        } else {
          html.removeAttribute('data-theme');
          localStorage.setItem('theme', 'dark');
        }
      });
    })();
  </script>

  <!-- Global search logic -->
  <script>
    (function() {
      const searchInput = document.getElementById('search-input');
      const searchDropdown = document.getElementById('search-dropdown');
      let allCategories = [];
      let selectedIndex = -1;

      // Načti všechny kategorie z template elementů
      function loadAllCategories() {
        const templates = document.querySelectorAll('.subnav-tpl');
        const categories = [];

        templates.forEach(template => {
          const tableName = template.getAttribute('data-table');
          const links = template.content.querySelectorAll('a');

          // Najdi hlavní kategorii v levém menu
          const mainCategory = document.querySelector(`.nav-cats a[data-cat="${tableName}"]`);
          const mainCategoryName = mainCategory ? mainCategory.textContent.trim() : tableName;

          links.forEach(link => {
            const title = link.textContent.trim();
            const href = link.getAttribute('href');

            categories.push({
              title: title,
              mainCategory: mainCategoryName,
              tableName: tableName,
              href: href,
              searchText: (title + ' ' + mainCategoryName).toLowerCase()
            });
          });
        });

        return categories;
      }

      // Fuzzy search - najde i s překlepem
      function fuzzyMatch(text, query) {
        text = text.toLowerCase();
        query = query.toLowerCase();

        // Přesná shoda
        if (text.includes(query)) return 3;

        // Shoda začátku slova
        const words = text.split(' ');
        for (let word of words) {
          if (word.startsWith(query)) return 2;
        }

        // Fuzzy match - všechny znaky v pořadí
        let queryIndex = 0;
        for (let i = 0; i < text.length && queryIndex < query.length; i++) {
          if (text[i] === query[queryIndex]) {
            queryIndex++;
          }
        }
        if (queryIndex === query.length) return 1;

        return 0;
      }

      // Filtruj kategorie podle dotazu
      function filterCategories(query) {
        if (!query.trim()) return [];

        const results = allCategories
          .map(cat => ({
            ...cat,
            score: fuzzyMatch(cat.searchText, query)
          }))
          .filter(cat => cat.score > 0)
          .sort((a, b) => {
            // Seřaď podle score, pak abecedně
            if (b.score !== a.score) return b.score - a.score;
            return a.title.localeCompare(b.title, 'cs');
          });

        return results;
      }

      // Vykreslí výsledky do dropdownu
      function renderResults(results) {
        if (results.length === 0) {
          searchDropdown.innerHTML = '<div class="search-no-results">Žádné výsledky</div>';
          return;
        }

        // Seskup podle hlavní kategorie
        const grouped = {};
        results.forEach(result => {
          if (!grouped[result.mainCategory]) {
            grouped[result.mainCategory] = [];
          }
          grouped[result.mainCategory].push(result);
        });

        let html = '';
        Object.keys(grouped).forEach(mainCat => {
          html += `<div class="search-result-group">`;
          html += `<div class="search-group-title">${mainCat}</div>`;

          grouped[mainCat].forEach((result, idx) => {
            html += `
              <a href="${result.href}" class="search-result-item" data-index="${results.indexOf(result)}">
                <svg class="search-result-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <div class="search-result-text">
                  <div class="search-result-title">${result.title}</div>
                  <div class="search-result-breadcrumb">${result.mainCategory}</div>
                </div>
              </a>
            `;
          });

          html += `</div>`;
        });

        searchDropdown.innerHTML = html;
        selectedIndex = -1;
      }

      // Zobraz/skryj dropdown
      function showDropdown() {
        searchDropdown.classList.add('active');
      }

      function hideDropdown() {
        searchDropdown.classList.remove('active');
        selectedIndex = -1;
      }

      // Navigace klávesnicí
      function updateSelectedItem() {
        const items = searchDropdown.querySelectorAll('.search-result-item');
        items.forEach((item, idx) => {
          if (idx === selectedIndex) {
            item.classList.add('selected');
            item.scrollIntoView({ block: 'nearest' });
          } else {
            item.classList.remove('selected');
          }
        });
      }

      // Event listeners
      searchInput.addEventListener('input', function() {
        const query = this.value;

        if (!query.trim()) {
          hideDropdown();
          return;
        }

        const results = filterCategories(query);
        renderResults(results);
        showDropdown();
      });

      searchInput.addEventListener('focus', function() {
        if (this.value.trim() && searchDropdown.children.length > 0) {
          showDropdown();
        }
      });

      // Klávesnice - šipky a Enter
      searchInput.addEventListener('keydown', function(e) {
        const items = searchDropdown.querySelectorAll('.search-result-item');

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
          updateSelectedItem();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          selectedIndex = Math.max(selectedIndex - 1, -1);
          updateSelectedItem();
        } else if (e.key === 'Enter' && selectedIndex >= 0) {
          e.preventDefault();
          items[selectedIndex].click();
        } else if (e.key === 'Escape') {
          hideDropdown();
          this.blur();
        }
      });

      // Kliknutí mimo zavře dropdown
      document.addEventListener('click', function(e) {
        if (!searchInput.contains(e.target) && !searchDropdown.contains(e.target)) {
          hideDropdown();
        }
      });

      // Načti kategorie při startu
      allCategories = loadAllCategories();
    })();
  </script>
</body>
</html>
